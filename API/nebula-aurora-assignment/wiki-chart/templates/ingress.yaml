{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wiki-chart.fullname" . }}-ingress
  labels:
    {{- include "wiki-chart.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - http:
        paths:
        # FastAPI routes
        - path: /users
          pathType: Prefix
          backend:
            service:
              name: {{ include "wiki-chart.fullname" . }}-fastapi
              port:
                number: {{ .Values.fastapi.service.port }}
        - path: /posts
          pathType: Prefix
          backend:
            service:
              name: {{ include "wiki-chart.fullname" . }}-fastapi
              port:
                number: {{ .Values.fastapi.service.port }}
        # Grafana routes
        - path: /grafana
          pathType: Prefix
          backend:
            service:
              name: {{ include "wiki-chart.fullname" . }}-grafana
              port:
                number: {{ .Values.grafana.service.port }}
{{- end }}
