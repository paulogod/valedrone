name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public artifact
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '.env' \
            --exclude 'API/' \
            --exclude 'workers/' \
            --exclude 'dist/' \
            --exclude 'security_best_practices_report.md' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.xlsx'

      - name: Inject public runtime config
        env:
          CHAT_API_BASE_URL: ${{ vars.CHAT_API_BASE_URL }}
          WHATSAPP_PHONE: ${{ vars.WHATSAPP_PHONE }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          config_path = Path("dist/config.js")
          config = config_path.read_text()
          config = config.replace("__CHAT_API_BASE_URL__", os.environ.get("CHAT_API_BASE_URL", ""))
          config = config.replace("__WHATSAPP_PHONE__", os.environ.get("WHATSAPP_PHONE", "5512996192233"))
          config_path.write_text(config)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
